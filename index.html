<body>
<header>
  <div class="brand"><div class="logo">焊</div><div><h1>安川机器人焊接数字化监控平台</h1><small>V5.2 · 多工位 / 多机器人管理</small></div></div>
  <div class="head-right"><span class="desktop-only">网站后台：<b id="backendState" class="yellow">正在连接</b> · 现场机器人：未连接</span><span class="pill"><span class="dot status-warn"></span>演示数据</span></div>
</header>
<div class="app">
<nav>
 <div class="nav-title">监控中心</div>
 <button class="navbtn active" data-page="overview"><span class="navicon">▦</span>车间总览</button>
 <button class="navbtn" data-page="stations"><span class="navicon">⌂</span>工位监控</button>
 <button class="navbtn" data-page="robots"><span class="navicon">◈</span>机器人监控</button>
 <div class="nav-title">参数与记录</div>
 <button class="navbtn" data-page="recipes"><span class="navicon">≡</span>焊缝配方</button>
 <button class="navbtn" data-page="alarms"><span class="navicon">⚑</span>报警中心</button>
 <button class="navbtn" data-page="history"><span class="navicon">◷</span>历史记录</button>
 <div class="nav-title">平台设置</div>
 <button class="navbtn" data-page="settings"><span class="navicon">⚙</span>系统管理</button>
 <div class="navfoot">状态说明<br><span class="green">● 正常</span>　<span class="yellow">● 待机</span><br><span class="red">● 参数异常</span>　<span>● 未接入</span><br><br>本版本数据为演示数据。</div>
</nav>
<main id="main"></main>
</div>
<script>
const recipeValues = [
[25,200],[25,200],[25,200],[25,200],[25,200],[25,200],[25,200],[25,200],[25,200],
[25,200],[23,200],[25,200],[25,200],[25,200],[25,200],[25,240],[25,240],[23,220],
[23,220],[25,200],[25,200],[22,170],[22,170],[22,170],[24,220],[24,220],[25,220]
];
let recipe = recipeValues.map((v,i)=>({seam:i+1, voltage:v[0], current:v[1], status:"未检测", currentVoltage:null,currentCurrent:null}));
let backendOnline = false;
let databaseMode = "unknown";
let backendError = "";
let alarms = [];
let recipeSyncInFlight = false;
let lastRecipeSyncAt = null;
let recipeSyncError = "";

// 页面启动时必须先初始化这些状态变量，再执行 render()。
// 否则 activePage / layoutMode 未定义会让脚本提前中断，后台 API 不会被调用。
let activePage = "overview";
let layoutMode = "cards";
let activeStation = "222ST";
let activeRobot = "R1";
async function apiRequest(path, options={}) {
  // 每次请求都绕过浏览器缓存，保证读取到后台最新数据。
  const response = await fetch(path, {cache:"no-store", headers:{"Content-Type":"application/json"}, ...options});
  if (!response.ok) {
    let detail = "";
    try { const body = await response.json(); detail = body.error || body.message || ""; } catch (_) {}
    throw new Error(detail ? `服务器返回 ${response.status}：${detail}` : "服务器返回 " + response.status);
  }
  return response.json();
}
async function loadPersistentData() {
  try {
    const health = await apiRequest("/api/health");
    const [data, alarmData] = await Promise.all([
      apiRequest("/api/recipes"),
      apiRequest("/api/alarms")
    ]);
    if (Array.isArray(data.recipes) && data.recipes.length === 27) {
      recipe = data.recipes.map((r,i)=>({...recipe[i], ...r, status:"未检测", currentVoltage:null, currentCurrent:null}));
    } else {
      throw new Error("后台配方数据不是完整的27条记录");
    }
    if (Array.isArray(alarmData.alarms)) alarms = alarmData.alarms;
    databaseMode = health.database || "unknown";
    backendOnline = health.ok === true;
    backendError = "";
    recipeSyncError = "";
    lastRecipeSyncAt = new Date();
  } catch (e) {
    backendOnline = false;
    backendError = e.message || "后台连接失败";
    recipeSyncError = backendError;
  }
  render();
}

// 每5秒从后台重新读取配方；此接口只执行 GET，不会向 Supabase 或机器人写入数据。
async function syncRecipesFromDatabase() {
  if (recipeSyncInFlight) return;
  recipeSyncInFlight = true;
  try {
    const [health, data] = await Promise.all([
      apiRequest("/api/health"),
      apiRequest("/api/recipes")
    ]);
    if (health.ok !== true) throw new Error("后台健康检查未通过");
    if (!Array.isArray(data.recipes) || data.recipes.length !== 27) {
      throw new Error("后台配方数据不是完整的27条记录");
    }

    const previous = recipe;
    const latest = data.recipes.map((r, i) => ({
      ...previous[i],
      seam: Number(r.seam),
      voltage: Number(r.voltage),
      current: Number(r.current),
      updated_at: r.updated_at
    }));
    const changed = latest.some((r, i) =>
      Number(previous[i]?.voltage) !== r.voltage ||
      Number(previous[i]?.current) !== r.current
    );

    recipe = latest;
    databaseMode = health.database || databaseMode;
    backendOnline = true;
    backendError = "";
    recipeSyncError = "";
    lastRecipeSyncAt = new Date();
    updateBackendIndicator();

    if (changed && activePage === "recipes") {
      const searchValue = document.getElementById("recipeSearch")?.value || "";
      const statusValue = document.getElementById("recipeStatus")?.value || "all";
      render();
      const search = document.getElementById("recipeSearch");
      const status = document.getElementById("recipeStatus");
      if (search) search.value = searchValue;
      if (status) status.value = statusValue;
      filterRecipe();
    } else {
      updateRecipeSyncStatus();
    }
  } catch (e) {
    backendOnline = false;
    backendError = e.message || "后台连接失败";
    recipeSyncError = backendError;
    updateBackendIndicator();
    updateRecipeSyncStatus();
  } finally {
    recipeSyncInFlight = false;
  }
}

function updateRecipeSyncStatus() {
  const el = document.getElementById("recipeSyncStatus");
  if (!el) return;
  if (recipeSyncError) {
    el.textContent = "自动同步失败：" + recipeSyncError;
    el.className = "footer-note yellow";
  } else if (lastRecipeSyncAt) {
    el.textContent = "数据库自动同步：每5秒检查一次 · 最近成功同步：" + lastRecipeSyncAt.toLocaleTimeString("zh-CN", {hour12:false});
    el.className = "footer-note green";
  } else {
    el.textContent = "正在连接数据库，准备启动自动同步…";
    el.className = "footer-note";
  }
}

function updateBackendIndicator() {
  const state = document.getElementById("backendState");
  if (state) {
    state.textContent = backendOnline ? "已连接" : "未连接";
    state.className = backendOnline ? "green" : "yellow";
  }
}
async function refreshAlarms(showFeedback=false) {
  try {
    const alarmData = await apiRequest("/api/alarms");
    if (!Array.isArray(alarmData.alarms)) throw new Error("后台返回的报警数据格式不正确");
    alarms = alarmData.alarms;
    if (showFeedback) alert(`已从数据库读取 ${alarms.length} 条报警记录。`);
  } catch (e) {
    if (showFeedback) alert("读取报警记录失败：" + e.message);
  }
  render();
}
async function persistAlarm(alarm) {
  if (!backendOnline) throw new Error(backendError || "网站后台尚未连接，不能确认报警已保存");
  return await apiRequest("/api/alarms", {method:"POST",body:JSON.stringify(alarm)});
}
const stations=[
 // 一区：按参考平面图保留6个工位；其中3个配置焊接机器人，共22台。
 {id:"103ST",area:"一区",count:2,enabled:false,desc:"2台焊接机器人 · 现场通信待接入",layout:{x:45.8,y:18.0,w:7.3,h:8.6}},
 {id:"104ST",area:"一区",count:10,enabled:false,desc:"10台焊接机器人 · 现场通信待接入",layout:{x:59.5,y:18.0,w:7.3,h:8.6}},

function recipesPage(){return `${head("焊缝配方监控","222ST · R1 · 27条标准配方（只读）",`<button onclick="exportRecipe()">导出配方 CSV</button>`)}<div class="kpis">${kpi("标准焊缝","27 条","数据库基准参数","green")}${kpi("已检测","0 条","真实机器人尚未接入","yellow")}${kpi("模拟异常",recipe.filter(x=>x.status==="模拟异常").length+" 条","仅用于验证界面","red")}${kpi("基准来源","Supabase","网页只读取，不修改标准值","blue")}</div><div class="panel"><div class="toolbar"><input id="recipeSearch" placeholder="搜索焊缝编号，例如 16" oninput="filterRecipe()"><select id="recipeStatus" onchange="filterRecipe()"><option value="all">全部状态</option><option value="未检测">未检测</option><option value="正常">正常</option><option value="模拟异常">模拟异常</option></select><button onclick="simulateChange()">模拟一条参数修改</button><button onclick="resetSimulation()">重置模拟状态（保留报警记录）</button></div><div class="tablewrap"><table id="recipeTable"><thead><tr><th>焊缝</th><th>标准电压 (V)</th><th>标准电流 (A)</th><th>当前设定电压 (V)</th><th>当前设定电流 (A)</th><th>状态</th><th>操作</th></tr></thead><tbody>${recipeRows()}</tbody></table></div><div class="footer-note">说明：标准电压、电流从 Supabase 读取，网页端不提供修改入口。当前设定值暂未接入真实机器人；“模拟参数修改”只测试网页逻辑，不会写入机器人控制器。</div><div id="recipeSyncStatus" class="footer-note">正在连接数据库，准备启动自动同步…</div></div>`}
function recipeRows(){return recipe.map(r=>`<tr data-seam="${r.seam}" data-status="${r.status}"><td class="num">${String(r.seam).padStart(2,"0")}</td><td class="num">${r.voltage}</td><td class="num">${r.current}</td><td class="num">${r.currentVoltage===null?"—":r.currentVoltage.toFixed(1)}</td><td class="num">${r.currentCurrent===null?"—":r.currentCurrent.toFixed(1)}</td><td class="${r.status==='模拟异常'?'red':r.status==='正常'?'green':'yellow'}">${r.status}</td><td><button onclick="testSeam(${r.seam})">测试比对</button></td></tr>`).join("")}
function filterRecipe(){let q=(document.getElementById("recipeSearch")?.value||"").trim();let st=document.getElementById("recipeStatus")?.value||"all";document.querySelectorAll("#recipeTable tbody tr").forEach(tr=>{tr.style.display=(!q||tr.dataset.seam.includes(q.padStart(2,"0"))||tr.dataset.seam===q)&& (st==="all"||tr.dataset.status===st)?"":"none"})}
function testSeam(n){let r=recipe[n-1];r.currentVoltage=r.voltage;r.currentCurrent=r.current;r.status="正常";render()}
async function simulateChange(){
  let r=recipe[10];r.currentVoltage=r.voltage+2;r.currentCurrent=r.current;r.status="模拟异常";
  const a={time:new Date().toLocaleString("zh-CN",{hour12:false}),station:"222ST",robot:"R1",seam:r.seam,field:"设定电压",standard:r.voltage+" V",current:r.currentVoltage+" V",delta:"+2 V",state:"模拟报警"};
  try {
    const saved = await persistAlarm(a);
    alarms.unshift({...a,id:saved.id});
    alert("模拟报警已成功写入数据库。现在可以刷新网页验证记录是否保留。");
  } catch(e) {
    alert("模拟异常已在当前页面标记，但报警没有写入数据库：\n" + e.message);
  }
  render();
}
function resetSimulation(){
  recipe.forEach(r=>{r.status="未检测";r.currentVoltage=null;r.currentCurrent=null});
  // 报警记录属于历史审计数据；重置界面模拟状态时不删除数据库中的记录。
  render();
}
function exportRecipe(){let rows=[["焊缝编号","标准电压(V)","标准电流(A)"],...recipe.map(r=>[r.seam,r.voltage,r.current])];let csv="\ufeff"+rows.map(r=>r.join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="222ST_R1_标准配方.csv";a.click();URL.revokeObjectURL(a.href)}

  const storageName = !backendOnline ? "后台未连接" : databaseMode==="supabase-postgresql" ? "Supabase 云端" : databaseMode==="local-sqlite" ? "本地 SQLite" : "数据库已连接";
  const storageNote = !backendOnline ? (backendError || "暂时无法确认报警是否已持久化") : "报警记录由服务器数据库保存";
  return `${head("报警中心","查看参数变化、设备通信和历史异常",`<button onclick="refreshAlarms(true)">刷新报警</button><button onclick="exportAlarms()">导出报警 CSV</button>`)}<div class="kpis">${kpi("报警记录",alarms.length+" 条","数据库中保存的历史记录","red")}${kpi("模拟报警",alarms.filter(a=>String(a.state||"").includes("模拟")).length+" 条","仅用于验证持久化","yellow")}${kpi("通信异常","0 条","尚未接入真实设备","green")}${kpi("记录方式",storageName,storageNote,backendOnline?"green":"yellow")}</div><div class="panel"><div class="tablewrap"><table><thead><tr><th>时间</th><th>工位</th><th>机器人</th><th>焊缝</th><th>异常项目</th><th>标准值</th><th>当前值</th><th>偏差</th><th>记录类型</th></tr></thead><tbody>${alarms.map(a=>`<tr><td>${a.time??""}</td><td>${a.station??""}</td><td>${a.robot??""}</td><td>${String(a.seam??"").padStart(2,"0")}</td><td>${a.field??""}</td><td>${a.standard??""}</td><td class="red">${a.current??""}</td><td class="red">${a.delta??""}</td><td class="yellow">${a.state??""}</td></tr>`).join("")||`<tr><td colspan="9" class="empty">暂无报警记录</td></tr>`}</tbody></table></div><div class="footer-note">模拟报警只用于验证数据库写入；现场机器人尚未接入。重置模拟状态不会删除已经保存的历史报警。</div></div>`;
}
function exportAlarms(){let rows=[["时间","工位","机器人","焊缝","异常项目","标准值","当前值","偏差","记录类型"],...alarms.map(a=>[a.time,a.station,a.robot,a.seam,a.field,a.standard,a.current,a.delta,a.state])];let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="焊接报警记录.csv";a.click()}
function historyPage(){return `${head("历史记录","按工位和机器人查看历史焊接数据") }<div class="panel"><div class="toolbar"><select>${stations.map(s=>`<option>${s.id}</option>`).join("")}</select><select><option>R1</option><option>R2</option><option>R3</option></select><input type="date" value="2026-10-24"><button class="primary" onclick="alert('历史记录查询将在接入数据库后启用。')">查询</button></div><div class="empty">当前没有真实历史数据。接入现场采集程序和数据库后，这里将显示工件、焊缝、设定参数、实际参数及焊接时间。</div></div>`}
function settingsPage(){return `${head("系统管理","工位配置、机器人配置与配方管理") }<div class="grid2"><div class="panel"><h3>工位与控制柜配置</h3><div class="tablewrap"><table><thead><tr><th>区域</th><th>工位</th><th>焊接机器人数量</th><th>配置说明</th><th>状态</th></tr></thead><tbody>${stations.map(s=>`<tr><td>${s.area}</td><td>${s.id}</td><td>${s.count||0}</td><td>${s.count>0?`${s.count}台机器人（控制柜映射待确认）`:"无焊接机器人（保留布局）"}</td><td class="${s.count>0?'yellow':'status-off'}">${s.count>0?"现场通信待接入":"不适用"}</td></tr>`).join("")}</tbody></table></div></div><div class="panel"><h3>平台设置</h3><div class="formgrid"><div class="field"><label>平台名称</label><input value="安川机器人焊接数字化监控平台"></div><div class="field"><label>采集周期（秒）</label><input type="number" value="0.5" min="0.2" step="0.1"></div><div class="field"><label>电压容差（V）</label><input type="number" value="0.1" step="0.1"></div><div class="field"><label>电流容差（A）</label><input type="number" value="1" step="1"></div></div><p class="hint">当前为界面原型，设置暂不保存到服务器。正式版将加入登录、角色权限、审核流程和数据库持久化。</p><button class="primary" onclick="alert('设置保存功能将在后端开发阶段启用。')">保存设置（演示）</button></div></div>`}
function render(){
 let m=document.getElementById("main");
 if(activePage==="overview")m.innerHTML=overview();else if(activePage==="stations")m.innerHTML=stationsPage();else if(activePage==="robots"){m.innerHTML=robotPage();drawChart()}else if(activePage==="recipes")m.innerHTML=recipesPage();else if(activePage==="alarms")m.innerHTML=alarmsPage();else if(activePage==="history")m.innerHTML=historyPage();else m.innerHTML=settingsPage();
 updateBackendIndicator();
 updateRecipeSyncStatus();
}
function drawChart(){let c=document.getElementById("trend");if(!c)return;let ctx=c.getContext("2d"),w=c.clientWidth,h=c.clientHeight,dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);ctx.strokeStyle="#24415f";ctx.lineWidth=1;for(let i=0;i<5;i++){let y=10+i*(h-25)/4;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-8,y);ctx.stroke()}function line(color,vals){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();vals.forEach((v,i)=>{let x=32+i*(w-45)/(vals.length-1),y=15+(h-35)*(1-v);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}line("#51a8ff",[.45,.49,.47,.53,.5,.56,.51,.55,.53,.58,.54,.57,.52,.55,.56,.54]);line("#28d17c",[.72,.7,.74,.69,.72,.68,.7,.73,.67,.71,.69,.72,.68,.7,.73,.71])}
window.addEventListener("resize",()=>{if(activePage==="robots")drawChart()});
render();
loadPersistentData().finally(() => {
  // 首次加载完成后启动后台轮询，页面无需手动刷新即可看到数据库变化。
  window.setInterval(syncRecipesFromDatabase, 5000);
});
</script>
</body>
</html>
